<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario General - ULEAM</title>
  <link rel="stylesheet" href="styles_web.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="barra_principal">
    <h1 class="titulo-principal">Inventario General</h1>
    <div style="display: flex; align-items: center; gap: 16px;">
      <button class="btn-rojo" onclick="cerrarSesion()">Cerrar Sesión</button>
      <img src="https://www.uleam.edu.ec/wp-content/uploads/2012/09/LOGO-ULEAM-VERTICAL.png" class="logo-uleam" style="height:70px;">
    </div>
  </div>
  <div style="max-width:1050px;margin:auto;padding:19px;">
    <!-- Contador de equipos -->
    <div style="background: #c1f5c7; padding: 12px 20px; border-radius: 10px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <strong style="font-size: 1.1em;">Total de Equipos:</strong> 
        <span id="contadorTotal" style="font-size: 1.3em; font-weight: 700;">0</span>
      </div>
      <div style="font-size: 0.9em; color: #1f3b27;">
        Activos: <strong id="contadorActivos">0</strong> | 
        En reparación: <strong id="contadorReparacion">0</strong> | 
        Dados de baja: <strong id="contadorBaja">0</strong>
      </div>
    </div>

    <!-- Barra de acciones/filtros -->
    <div class="filtros-bar">
      <input type="text" id="buscar" placeholder="Buscar por nombre, serie o responsable...">
      <select id="tipoFiltro">
        <option value="">Tipo</option>
        <option>Computador</option>
        <option>Proyector</option>
        <option>Impresora</option>
        <option>UPS</option>
        <option>Tablet</option>
        <option>Servidor</option>
        <option>Router</option>
      </select>
      <select id="ubicacionFiltro"><option value="">Ubicación</option></select>
      <select id="estadoFiltro">
        <option value="">Estado</option>
        <option>Activo</option>
        <option>En reparación</option>
        <option>Dado de baja</option>
      </select>
      <input type="date" id="fechaFiltro">
      <button onclick="filtrosReset()">Limpiar filtros</button>
      <button class="btn-blue" onclick="cargarInventario()">🔄 Actualizar</button>
      <button class="btn-blue" style="margin-left:auto;" onclick="nuevoEquipo()">+ Nuevo equipo</button>
    </div>

    <!-- Tabla del inventario -->
    <div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 18px #edf2f7;">
      <table class="tabla-inventario" id="tablaInventario">
        <thead>
          <tr>
            <th>Nombre del equipo</th><th>Tipo</th><th>Ubicación</th><th>Estado</th>
            <th>N.º de serie</th><th>Responsable</th><th>Fecha ingreso</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="inventarioBody"></tbody>
      </table>
    </div>

    <!-- Formulario registrar/editar -->
    <div class="form-cont">
      <div class="titulo-seccion">Registrar / Editar equipo</div>
      <form class="form-inline" id="formEquipo" onsubmit="guardarEquipo(event)">
        <div style="flex:1;">
          <label>Nombre del equipo *</label>
          <input type="text" id="nombreEquipo" placeholder="Ej. PC Docencia Lab 12" required>
        </div>
        <div style="flex:1;">
          <label>Tipo *</label>
          <select id="tipoEquipo" required>
            <option value="">Seleccionar tipo</option>
            <option>Computador</option><option>Proyector</option><option>Impresora</option>
            <option>UPS</option><option>Tablet</option><option>Servidor</option><option>Router</option>
          </select>
        </div>
        <div style="flex:1;">
          <label>Ubicación *</label>
          <input type="text" id="ubicacionEquipo" placeholder="Ej. Bloque A — Lab 3" required>
        </div>
        <div style="flex:1;">
          <label>Estado *</label>
          <select id="estadoEquipo" required>
            <option>Activo</option><option>En reparación</option><option>Dado de baja</option>
          </select>
        </div>
        <div style="flex:1;">
          <label>Número de serie *</label>
          <input type="text" id="serieEquipo" placeholder="Ej. SER-PC-009812" required>
        </div>
        <div style="flex:1;">
          <label>Responsable *</label>
          <input type="text" id="responsableEquipo" placeholder="Nombre del responsable" required>
        </div>
        <div style="flex:1;">
          <label>Marca</label>
          <input type="text" id="marcaEquipo" placeholder="Ej. Dell">
        </div>
        <div style="flex:1;">
          <label>Modelo</label>
          <input type="text" id="modeloEquipo" placeholder="Ej. Optiplex 7090">
        </div>
        <div style="flex:1;">
          <label>Valor de compra</label>
          <input type="number" step="0.01" id="valorEquipo" placeholder="0.00">
        </div>
        <div style="flex:1;">
          <label>Proveedor</label>
          <input type="text" id="proveedorEquipo" placeholder="Nombre del proveedor">
        </div>
        <div style="flex-basis:100%;">
          <label>Notas</label>
          <input type="text" id="notaEquipo" placeholder="Notas adicionales sobre el equipo...">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-rojo" onclick="formLimpiar()">Limpiar</button>
          <button type="submit" class="btn-verde">💾 Guardar equipo</button>
        </div>
      </form>
    </div>
  </div>

<script>
// ========== SISTEMA DE ALMACENAMIENTO SINCRONIZADO ==========
let inventarioGlobal = [];

function cargarInventario() {
  inventarioGlobal = [
    {
      nombre:'PC Docencia Lab 12', tipo:'Computador', ubicacion:'Bloque A — Lab 3', estado:'Activo',
      serie:'SER-PC-009812', responsable:'Ana Pérez', fecha:'10/09/2025',
      marca:'Dell', modelo:'Optiplex 7090', valor:1450.00, proveedor:'CompuExpress', notas:'Equipo principal de laboratorio.'
    },
    {
      nombre:'Proyector Aula Magna', tipo:'Proyector', ubicacion:'Aula Magna', estado:'En reparación',
      serie:'PRJ-77231', responsable:'Carlos Ruiz', fecha:'05/10/2025',
      marca:'Epson', modelo:'EB-X51', valor:730.00, proveedor:'Epson Ecuador', notas:'Pendiente repuesto lámpara.'
    },
    {
      nombre:'Impresora Adm. 2º piso', tipo:'Impresora', ubicacion:'Bloque B — Admin', estado:'Activo',
      serie:'HP-12A-5542', responsable:'Diana Soto', fecha:'22/08/2025',
      marca:'HP', modelo:'LaserJet M404', valor:890.00, proveedor:'OfiPro', notas:'Papel trabado resuelto.'
    },
    {
      nombre:'UPS Biblioteca', tipo:'UPS', ubicacion:'Biblioteca Central', estado:'Dado de baja',
      serie:'UPS-1500-AX9', responsable:'Luis Cano', fecha:'01/07/2025',
      marca:'APC', modelo:'Smart-UPS 1500', valor:560.00, proveedor:'ElectroDigital', notas:'Reciclado después de falla batería.'
    },
    {
      nombre:'Laptop Posgrado', tipo:'Computador', ubicacion:'Bloque C — Posgrado', estado:'Activo',
      serie:'LT-PGR-2025A', responsable:'Marina Aguayo', fecha:'03/02/2025',
      marca:'Lenovo', modelo:'ThinkPad E14', valor:1680.00, proveedor:'Lenovo Ecuador', notas:'Asignado a profesora visitante.'
    },
    {
      nombre:'Tablet Sala Docentes', tipo:'Tablet', ubicacion:'Bloque B — Sala Docentes', estado:'Activo',
      serie:'TB-1004-RV', responsable:'Marcelo Tapia', fecha:'13/06/2025',
      marca:'Samsung', modelo:'Galaxy Tab A8', valor:425.00, proveedor:'DataZone', notas:'Tablet para registro digital.'
    },
    {
      nombre:'Servidor Central', tipo:'Servidor', ubicacion:'DataCenter', estado:'Activo',
      serie:'SRV-CNTRL-004', responsable:'Ing. Gonzalo Vélez', fecha:'08/01/2025',
      marca:'HPE', modelo:'ProLiant DL380', valor:6500.00, proveedor:'HPE Quito', notas:'Servidor con backup diario.'
    },
    {
      nombre:'Router Principal', tipo:'Router', ubicacion:'Oficina de IT', estado:'Activo',
      serie:'RT-PR-2025B', responsable:'Sofía Martínez', fecha:'15/03/2025',
      marca:'Cisco', modelo:'Catalyst 9200', valor:1200.00, proveedor:'Cisco Store', notas:'Configurado para red interna.'
    }
  ];
  renderTabla();
  actualizarContadores();
}

function renderTablaFiltrada(equiposFiltrados) {
  let body = '';
  for(let i = 0; i < equiposFiltrados.length; i++) {
    const eq = equiposFiltrados[i];
    body += `<tr>
      <td><strong>${eq.nombre}</strong></td>
      <td>${eq.tipo}</td>
      <td>${eq.ubicacion}</td>
      <td>${badgeEstado(eq.estado)}</td>
      <td>${eq.serie}</td>
      <td>${eq.responsable}</td>
      <td>${eq.fecha}</td>
      <td>
        <button class="btn-eliminar" onclick="eliminarEquipo(${i})">🗑️ Eliminar</button>
      </td>
    </tr>`;
  }
  document.getElementById('inventarioBody').innerHTML = body;
}

function badgeEstado(estado) {
  const clases = {
    'Activo': 'badge-success',
    'En reparación': 'badge-warning',
    'Dado de baja': 'badge-danger'
  };
  return `<span class="badge ${clases[estado] || ''}">${estado}</span>`;
}

function filtrosReset() {
  document.getElementById('buscar').value = '';
  document.getElementById('tipoFiltro').value = '';
  document.getElementById('ubicacionFiltro').value = '';
  document.getElementById('estadoFiltro').value = '';
  document.getElementById('fechaFiltro').value = '';
  renderTabla();
}

function nuevoEquipo() {
  document.getElementById('formEquipo').reset();
  document.getElementById('nombreEquipo').focus();
}

function formLimpiar() {
  document.getElementById('formEquipo').reset();
}

function actualizarContadores() {
  const total = inventarioGlobal.length;
  const activos = inventarioGlobal.filter(e => /activo/i.test(e.estado)).length;
  const reparacion = inventarioGlobal.filter(e => /repar/i.test(e.estado)).length;
  const baja = inventarioGlobal.filter(e => /baja/i.test(e.estado)).length;
  
  document.getElementById('contadorTotal').textContent = total;
  document.getElementById('contadorActivos').textContent = activos;
  document.getElementById('contadorReparacion').textContent = reparacion;
  document.getElementById('contadorBaja').textContent = baja;
}

function guardarEquipo(e) {
  e.preventDefault();
  const nuevoEquipo = {
    nombre: document.getElementById('nombreEquipo').value,
    tipo: document.getElementById('tipoEquipo').value,
    ubicacion: document.getElementById('ubicacionEquipo').value,
    estado: document.getElementById('estadoEquipo').value,
    serie: document.getElementById('serieEquipo').value,
    responsable: document.getElementById('responsableEquipo').value,
    fecha: new Date().toLocaleDateString(),
    marca: document.getElementById('marcaEquipo').value || '-',
    modelo: document.getElementById('modeloEquipo').value || '-',
    valor: parseFloat(document.getElementById('valorEquipo').value) || 0,
    proveedor: document.getElementById('proveedorEquipo').value || '-',
    notas: document.getElementById('notaEquipo').value || '-'
  };
  
  inventarioGlobal.push(nuevoEquipo);
  renderTabla();
  actualizarContadores();
  e.target.reset();
  alert('✅ Equipo guardado correctamente');
}

function eliminarEquipo(index) {
  if(confirm('¿Está seguro de eliminar este equipo?')) {
    inventarioGlobal.splice(index, 1);
    renderTabla();
    actualizarContadores();
  }
}


function aplicarFiltros() {
  const textoBusqueda = document.getElementById('buscar').value.toLowerCase();
  const tipoFiltro = document.getElementById('tipoFiltro').value;
  const ubicacionFiltro = document.getElementById('ubicacionFiltro').value;
  const estadoFiltro = document.getElementById('estadoFiltro').value;
  const fechaFiltro = document.getElementById('fechaFiltro').value;

  const equiposFiltrados = inventarioGlobal.filter(equipo => {
    return (!textoBusqueda || 
            equipo.nombre.toLowerCase().includes(textoBusqueda) ||
            equipo.serie.toLowerCase().includes(textoBusqueda) ||
            equipo.responsable.toLowerCase().includes(textoBusqueda)) &&
           (!tipoFiltro || equipo.tipo === tipoFiltro) &&
           (!ubicacionFiltro || equipo.ubicacion === ubicacionFiltro) &&
           (!estadoFiltro || equipo.estado === estadoFiltro) &&
           (!fechaFiltro || equipo.fecha === fechaFiltro);
  });

  renderTablaFiltrada(equiposFiltrados);
}

function renderTabla() {
  const tbody = document.getElementById('inventarioBody');
  let html = '';
  
  for(let i = 0; i < inventarioGlobal.length; i++) {
    const eq = inventarioGlobal[i];
    html += `<tr>
      <td><strong>${eq.nombre}</strong></td>
      <td>${eq.tipo}</td>
      <td>${eq.ubicacion}</td>
      <td>${badgeEstado(eq.estado)}</td>
      <td>${eq.serie}</td>
      <td>${eq.responsable}</td>
      <td>${eq.fecha}</td>
      <td>
        <button class="btn-eliminar" onclick="eliminarEquipo(${i})">🗑️ Eliminar</button>
      </td>
    </tr>`;
  }
  
  tbody.innerHTML = html;
}

document.getElementById('buscar').addEventListener('input', aplicarFiltros);
document.getElementById('tipoFiltro').addEventListener('change', aplicarFiltros);
document.getElementById('ubicacionFiltro').addEventListener('change', aplicarFiltros);
document.getElementById('estadoFiltro').addEventListener('change', aplicarFiltros);
document.getElementById('fechaFiltro').addEventListener('change', aplicarFiltros);

// Cargar al inicio
window.onload = cargarInventario;
</script>
</body>
</html>
